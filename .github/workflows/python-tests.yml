name: MAX2TG Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14", "3.15"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Use current reviewed pip installer
        run: python -m pip install --upgrade pip==26.3
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Static check of application and tests
        run: python -m ruff check --select F app/tg_handler.py app/tg_sender.py app/tg_help.py app/max_search.py app/telegram_entities.py app/telegram_html.py app/health.py app/telegram_egress.py app/telegram_gateway.py app/telegram_egress_ipc.py app/capsule_egress_outbox.py app/capsule_shared_ingress.py app/capsule_shared_listener.py app/shared_gateway_runtime.py app/shared_worker_runtime.py app/isolated_worker_runtime.py app/container_supervisor.py app/runtime_lock.py app/lifecycle_reconcile.py app/dependency_supervisor.py tests/test_dependency_supervisor.py app/recovery_manifest.py app/coordinated_backup.py app/restored_start_gate.py app/encrypted_storage.py app/encrypted_credentials.py app/encrypted_backup.py tests/test_encrypted_storage.py tests/test_recovery_manifest.py tests/test_coordinated_backup.py tests/test_lifecycle_reconcile.py tests/test_container_supervisor.py tests/supervised_container_fixture.py scripts/test-container-supervisor.py app/worker_secrets.py tests/test_worker_secrets.py app/shared_onboarding.py app/worker_provision.py app/forum_guard.py tests/test_forum_guard.py app/telegram_budget.py tests/test_telegram_budget.py tests/test_forum_scale.py app/egress_policy.py app/egress_tunnel.py app/linux_egress_policy.py scripts/saas-broker-policy.py tests/test_linux_egress_policy.py tests/linux_egress_kernel_fixture.py app/pinned_broker.py tests/test_pinned_broker.py app/linux_namespace_gate.py tests/test_linux_namespace_gate.py tests/pinned_broker_linux_fixture.py scripts/test-pinned-broker-linux.py tests/linux_veth_fixture.py app/linux_pin_rotation.py tests/test_linux_pin_rotation.py tests/linux_pin_rotation_fixture.py tests/test_live_pin_rotation.py tests/linux_live_rotation_fixture.py tests/linux_client_rotation_fixture.py tests/linux_journal_rotation_fixture.py app/operator_pin_rotation.py tests/test_operator_pin_rotation.py app/rotation_fence.py tests/test_rotation_fence.py tests/linux_rotation_crash_fixture.py tests/linux_live_controller_crash_fixture.py tests/linux_fresh_recovery_fixture.py app/recovery_transition.py tests/test_recovery_transition.py app/generation_ledger.py tests/test_generation_ledger.py tests/linux_generation_fixture.py app/generation_controller.py tests/test_generation_controller.py tests/test_generation_recovery.py app/operator_boundary.py tests/test_operator_boundary.py app/controller_lifeline.py tests/test_controller_lifeline.py app/controller_lease.py tests/test_controller_lease.py app/operator_watchdog.py tests/test_operator_watchdog.py app/cgroup_readback.py tests/test_cgroup_readback.py tests/linux_operator_watchdog_fixture.py app/host_storage_preflight.py scripts/saas-host-preflight.py tests/test_host_storage_preflight.py app/deployment_plan.py app/load_metrics.py tests/test_load_metrics.py app/stage_profile.py tests/test_stage_profile.py tests/synthetic_long_poll.py tests/test_synthetic_long_poll.py tests/synthetic_mixed_load.py tests/test_synthetic_mixed_load.py tests/soak_observe.py tests/test_soak_observe.py app/wal_maintenance.py tests/test_wal_maintenance.py tests/virtual_budget_load.py tests/test_virtual_budget_load.py tests/weighted_budget.py tests/test_weighted_budget.py app/weighted_budget.py tests/test_receipt_index.py scripts/benchmark-receipt-index.py app/revoked_receipts.py tests/test_revoked_receipts.py scripts/saas-placement-plan.py scripts/test-placement-plan.py tests/test_deployment_plan.py app/operator_stage.py tests/test_operator_stage.py scripts/test-operator-stage.py app/operator_lifecycle.py tests/test_operator_lifecycle.py app/operator_backup.py tests/test_operator_backup.py tests/operator_backup_fixture.py tests/operator_restore_fixture.py app/operator_sessions.py tests/test_operator_sessions.py tests/operator_sessions_fixture.py app/max_account_binding.py tests/test_max_account_binding.py tests/account_binding_fixture.py scripts/test-placed-runtime.py tests/placement_runtime_fixture.py app/isolated_transport.py app/max_client.py tests/test_isolated_transport.py tests/test_egress_policy.py tests/network_tunnel_fixture.py scripts/test-network-tunnel.py tests/supervised_proxy_fixture.py scripts/test-supervised-proxy.py tests/test_shared_onboarding.py tests/supervised_bridge_fixture.py scripts/test-supervised-bridge.py tests/test_isolated_worker.py tests/isolated_container_fixture.py scripts/test-isolated-containers.py app/shared_topic_provision.py tests/test_shared_runtime.py tests/shared_runtime_child.py app/telegram_control_plane.py app/telegram_inbox.py tests/test_shared_topic_routing.py app/capsule_worker.py app/capsule_registry.py app/capsule_supervisor.py app/telegram_ipc.py scripts/max2tg-preflight.py tests/test_handler_modules.py tests/test_telegram_html_module.py tests/test_runtime_lock_policy.py tests/test_health.py tests/test_polling.py tests/test_telegram_egress.py tests/test_shared_gateway_ipc.py
      - name: Install media processing runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Full unit and contract suite (no production credentials)
        run: python -m pytest -q
      - name: Check immutable release runtime before messenger access
        if: matrix.python-version == '3.15'
        run: python scripts/max2tg-preflight.py

  node-watch:
    name: Session watcher syntax (Node 26.13.1 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
      - name: Check watcher syntax, without accessing browser or credentials
        run: node --check scripts/max2tg-session-watch.js

  docker-image:
    name: Build isolated Python 3.15 runtime image
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image (no production secrets or state)
        run: docker build --pull --tag max2tg:ci .
      - name: Validate runtime pins inside candidate image
        run: docker run --rm --entrypoint python max2tg:ci scripts/max2tg-preflight.py
      - name: Verify isolated shared gateway and two non-root tenant containers
        run: python3 scripts/test-isolated-containers.py --image max2tg:ci
      - name: Verify durable supervisor lifecycle with disposable containers
        run: python3 scripts/test-container-supervisor.py --image max2tg:ci
      - name: Verify supervised end-to-end delivery and worker crash recovery
        run: python3 scripts/test-supervised-bridge.py --image max2tg:ci
      - name: Verify isolated HTTPS and WSS tunnel policy
        run: python3 scripts/test-network-tunnel.py --image max2tg:ci
      - name: Verify pinned broker with isolated actual MAX and Telegram clients
        run: python3 scripts/test-network-tunnel.py --image max2tg:ci --pinned
      - name: Verify nftables egress filtering inside disposable network-none namespace
        run: |
          docker build -t max2tg:kernel-test -f - . <<'DOCKER'
          FROM max2tg:ci
          RUN apt-get update && apt-get install --yes --no-install-recommends nftables iproute2 util-linux openssl && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_egress_kernel_fixture
          python3 scripts/test-pinned-broker-linux.py --image max2tg:kernel-test
      - name: Verify combined routed TLS and exact nftables policy in private veth namespaces
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 128m --pids-limit 32 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture
      - name: Verify live broker rotation preserving retained TLS in private veth namespaces
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 128m --pids-limit 32 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --rotation
      - name: Verify two successive generations with durable adoption evidence
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 128m --pids-limit 32 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --generations
      - name: Verify controller progress lease expiration while writer remains alive
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 128m --pids-limit 32 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --controller-lease
      - name: Verify independent watchdog stops a stalled broker via exact pidfd
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 128m --pids-limit 32 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --operator-watchdog
      - name: Verify actual proxy-only clients during bound pin rotation and ambiguous MAX receipt
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 256m --pids-limit 64 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --clients
      - name: Verify durable gateway and worker journals during bound rotation
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 256m --pids-limit 64 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --journals
      - name: Verify live broker and durable journals fail closed on controller death
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 256m --pids-limit 64 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --controller-crash
      - name: Verify fresh namespace recovery with retained delivery journals
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 256m --pids-limit 64 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --fresh-recovery
      - name: Verify generation history continuity across actual controller crash and recovery
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --cap-add SETUID --cap-add SETGID --cap-add SETPCAP --security-opt no-new-privileges --memory 256m --pids-limit 64 --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_veth_fixture --generation-recovery
      - name: Verify durable rotation fence after real controller SIGKILL
        run: docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --cap-add SYS_ADMIN --security-opt no-new-privileges --memory 128m --pids-limit 32 --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_rotation_crash_fixture
      - name: Verify atomic pin replacement and transaction rollback in disposable namespace
        run: docker run --rm --network none --read-only --cap-drop ALL --cap-add NET_ADMIN --security-opt no-new-privileges --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint python max2tg:kernel-test -m tests.linux_pin_rotation_fixture
      - name: Verify supervised actual-client bridge and broker outage recovery
        run: python3 scripts/test-supervised-proxy.py --image max2tg:ci
      - name: Verify encrypted credentials in separate read-only key volumes
        run: python3 scripts/test-supervised-proxy.py --image max2tg:ci --encrypted
      - name: Verify held Linux deployment placement
        run: python3 scripts/test-placement-plan.py --image max2tg:ci
      - name: Verify persistent held operator staging
        run: python3 scripts/test-operator-stage.py --image max2tg:ci
      - name: Verify persistent operator-controlled synthetic lifecycle
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --operator-lifecycle --operator-recovery --operator-backup --operator-restore
      - name: Verify stopped operator session management
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --operator-lifecycle --operator-sessions
      - name: Verify account-bound MAX credential renewal
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --account-binding
      - name: Verify actual runtime loops on planned native-volume placement
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes
      - name: Verify actual runtime loops on Linux bind placement
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci
      - name: Measure bounded synthetic two-tenant text burst
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --load 20
      - name: Verify four-tenant bounded text burst
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --load 20 --tenants 4 --profile
      - name: Verify event-driven synthetic long polling
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --load 20 --tenants 4 --profile --long-poll
      - name: Verify mixed sparse burst and idle workload
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --tenants 4 --profile --long-poll --mixed --storage-check --wal-maintenance
      - name: Verify opt-in balanced gateway with delayed synthetic API
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --tenants 4 --profile --long-poll --mixed --storage-check --wal-maintenance --delay150 --balanced
      - name: Verify balanced gateway cooldown crash and revocation
        run: python3 scripts/test-placed-runtime.py --image max2tg:ci --native-volumes --balanced-fault --reconcile-revoked
